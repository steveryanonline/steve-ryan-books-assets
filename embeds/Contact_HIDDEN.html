<iframe name="srb-submit-target" title="Form submit target" style="display:none"></iframe>
<script>
(() => {
  /* COLE A URL DO WEB APP DO APPS SCRIPT ENTRE AS ASPAS ABAIXO */
  const SHEET_ENDPOINT = 'COLE_AQUI_A_URL_DO_WEB_APP_DO_APPS_SCRIPT';
  const selector = '.srb-page form.srb-form';
  document.querySelectorAll('.srb-menu-toggle').forEach((button) => {
    const header = button.closest('.srb-header');
    button.addEventListener('click', () => {
      const isOpen = header.classList.toggle('srb-menu-open');
      button.setAttribute('aria-expanded', String(isOpen));
      button.textContent = isOpen ? '×' : '☰';
    });
  });
  document.querySelectorAll('.srb-mobile-menu a').forEach((link) => link.addEventListener('click', () => {
    const header = link.closest('.srb-header');
    const button = header.querySelector('.srb-menu-toggle');
    header.classList.remove('srb-menu-open');
    if (button) { button.setAttribute('aria-expanded', 'false'); button.textContent = '☰'; }
  }));
  document.querySelectorAll(selector).forEach((form) => {
    form.addEventListener('submit', () => {
      const status = form.querySelector('.srb-status');
      if (SHEET_ENDPOINT && !SHEET_ENDPOINT.startsWith('COLE_')) {
        const input = new FormData(form);
        const data = new URLSearchParams();
        ['name', 'email', 'message'].forEach((field) => { if (input.get(field)) data.set(field, input.get(field)); });
        fetch(SHEET_ENDPOINT, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:data.toString() });
      }
      if (status) status.textContent = 'Thank you — your details have been sent.';
    });
  });
})();
</script>
